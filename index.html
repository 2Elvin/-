function renderList(){
  var h="";
  for(var i=0;i<P.length;i++){
    var tq=0,ts=0;var s=P[i].s;
    for(var j=0;j<s.length;j++){tq+=s[j].d.length;ts+=s[j].d.length*s[j].p;}
    var tg="";for(var j=0;j<s.length;j++){if(j>0)tg+=" / ";tg+=s[j].n+" "+s[j].d.length+"题";}
    h+='<div class="pc"><h3>'+P[i].t+'</h3>';
    h+='<p>'+tg+' · 共'+tq+'题 · 满分'+ts+'分 · 60分钟</p>';
    h+='<button class="sb" onclick="startP('+i+')">开始答题</button></div>';
  }
  $("pl").innerHTML=h;
}

function startP(idx){
  pi=idx;qi=0;ans={};done=false;res={};tm=3600;
  if(tid){clearInterval(tid);tid=null;}
  showPage("page-quiz");
  if(mode===0){startT();}
  renderQ();
}

function startT(){
  if(tid)clearInterval(tid);
  tid=setInterval(function(){
    tm--;
    if(tm<=0){clearInterval(tid);tid=null;alert("时间到，自动交卷！");doSubmit();return;}
    var el=$("clk");
    if(el){
      var m=Math.floor(tm/60),s=tm%60;
      el.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
      el.style.color=tm<300?"#f44336":"#d4a843";
    }
  },1000);
}

function renderQ(){
  var info=findQ(qi);
  if(!info)return;
  var sec=info.s,q=sec.d[info.qi];
  var isM=sec.n==="多选题";
  var isT=sec.n==="判断题";
  var tq=totalQ();
  var h="";

  h+='<div class="qh"><button class="bk" onclick="exitQ()">X</button>';
  h+='<span class="hi">'+P[pi].t+(mode===0?" 考试模式":" 练习模式")+'</span>';
  if(mode===0){
    var m=Math.floor(tm/60),s=tm%60;
    h+='<span class="ht" id="clk" style="'+(tm<300?"color:#f44336":"")+'">'+(m<10?"0":"")+m+":"+(s<10?"0":"")+s+'</span>';
  }else{
    h+='<span class="ht" style="color:#777">'+(qi+1)+'/'+tq+'</span>';
  }
  h+='</div>';

  h+='<div class="qt">';
  var fi=0;
  for(var si=0;si<P[pi].s.length;si++){
    h+='<span class="tl">'+P[pi].s[si].n.substring(0,2)+'</span>';
    for(var j=0;j<P[pi].s[si].d.length;j++){
      var idx=fi++;
      var c="tn";
      if(mode===1&&res[idx]!==undefined)c+=res[idx]?" ck":" wr";
      else if(ans[idx]!==undefined)c+=" an";
      if(idx===qi)c+=" cu";
      h+='<button class="'+c+'" onclick="goTo('+idx+')">'+(j+1)+'</button>';
    }
  }
  h+='</div>';

  h+='<div class="qb">';
  h+='<div class="st">'+sec.n+'</div>';
  h+='<div class="qi">第'+(info.qi+1)+'题 · '+sec.p+'分</div>';
  h+='<div class="qt2">'+q.q+'</div>';

  if(isT){
    h+='<div class="tfr">';
    var lb=["对","错"],vl=[1,0];
    for(var vi=0;vi<2;vi++){
      var v=vl[vi],sel=ans[qi]===v;
      var c="op";
      if(mode===1&&done){
        if(v===q.a)c+=" ck";
        if(sel&&v!==q.a)c+=" wr";
      }
      if(sel&&!(mode===1&&done&&v!==q.a))c+=" sl";
      var dt="";
      if(sel){dt=(mode===1&&done?(v===q.a?"V":"X"):"V");}
      h+='<div class="'+c+'" onclick="pick('+qi+','+v+',0)"><span class="od">'+dt+'</span><span class="ot">'+lb[vi]+'</span></div>';
    }
    h+='</div>';
  }else{
    for(var vi=0;vi<q.o.length;vi++){
      var lb=String.fromCharCode(65+vi);
      var iA=Array.isArray(ans[qi]);
      var sel=iA?(ans[qi].indexOf(vi)>-1):(ans[qi]===vi);
      var c="op";
      if(mode===1&&done){
        var iC=Array.isArray(q.a)?(q.a.indexOf(vi)>-1):(q.a===vi);
        if(iC)c+=" ck";
        if(sel&&!iC)c+=" wr";
      }
      if(sel&&!(mode===1&&done)){
        var iC2=Array.isArray(q.a)?(q.a.indexOf(vi)>-1):(q.a===vi);
        if(!(mode===1&&done&&!iC2))c+=" sl";
      }
      var dt="";
      if(sel){
        if(mode===1&&done){
          var iC3=Array.isArray(q.a)?(q.a.indexOf(vi)>-1):(q.a===vi);
          dt=iC3?"V":"X";
        }else{dt="V";}
      }
      h+='<div class="'+c+'" onclick="pick('+qi+','+vi+','+(isM?1:0)+')"><span class="od">'+dt+'</span><span class="ot"><span class="ol">'+lb+'.</span>'+q.o[vi]+'</span></div>';
    }
  }

  if(mode===1&&done){
    var ok=res[qi];
    var ca=isT?(q.a===1?"对":"错"):fmtA(q.a);
    h+='<div class="pt '+(ok?"pa":"fa")+'">'+(ok?"V 回答正确":"X 回答错误 - 正确答案: "+ca)+'</div>';
  }
  h+='</div>';

  h+='<div class="qf">';
  h+='<button class="fb pr" onclick="prevQ()"'+(qi===0?" disabled":"")+'>上一题</button>';
  if(qi>=tq-1){
    h+='<button class="fb nx" disabled>下一题</button>';
  }else{
    h+='<button class="fb nx" onclick="nextQ()">下一题</button>';
  }
  if(mode===0){
    h+='<button class="fb su" onclick="doSubmit()">交卷</button>';
  }else if(qi>=tq-1){
    h+='<button class="fb su" onclick="doSubmit()">查看成绩</button>';
  }
  h+='</div>';

  $("page-quiz").innerHTML=h;
}

function pick(fi,v,multi){
  if(mode===1&&done)return;
  if(multi){
    var arr=ans[fi]!==undefined?(Array.isArray(ans[fi])?ans[fi].slice()):[];
    var pos=arr.indexOf(v);
    if(pos>-1)arr.splice(pos,1);else arr.push(v);
    arr.sort();
    ans[fi]=arr.length>0?arr:undefined;
  }else{
    ans[fi]=v;
  }
  if(mode===1){checkA(fi);}else{renderQ();}
}

function checkA(fi){
  var info=findQ(fi);
  if(!info)return;
  var sec=info.s,q=sec.d[info.qi];
  done=true;
  if(sec.n==="判断题"){
    res[fi]=(ans[fi]===q.a);
  }else if(Array.isArray(q.a)){
    var ua=Array.isArray(ans[fi])?ans[fi]:[];
    res[fi]=(q.a.length===ua.length)&&q.a.every(function(a){return ua.indexOf(a)>-1;});
  }else{
    res[fi]=(ans[fi]===q.a);
  }
  renderQ();
}

function goTo(fi){
  qi=fi;done=false;renderQ();
}

function prevQ(){if(qi>0){qi--;done=false;renderQ();}}
function nextQ(){if(qi<totalQ()-1){qi++;done=false;renderQ();}}

function doSubmit(){
  var ua=totalQ()-Object.keys(ans).length;
  if(ua>0&&!confirm("还有"+ua+"题未作答，确定提交吗？"))return;
  if(tid){clearInterval(tid);tid=null;}
  done=true;
  res={};var cor=0,tot=0,ss=[];var fi=0;
  for(var si=0;si<P[pi].s.length;si++){
    var sec=P[pi].s[si],sc=0;
    for(var j=0;j<sec.d.length;j++){
      var idx=fi++,q=sec.d[j];tot++;
      var ok=false;
      if(sec.n==="判断题"){ok=(ans[idx]===q.a);}
      else if(Array.isArray(q.a)){
        var ua2=Array.isArray(ans[idx])?ans[idx]:[];
        ok=(q.a.length===ua2.length)&&q.a.every(function(a){return ua2.indexOf(a)>-1;});
      }else{ok=(ans[idx]===q.a);}
      res[idx]=ok;if(ok){sc++;cor++;}
    }
    ss.push({n:sec.n,c:sc,t:sec.d.length,sc:sc*sec.p,ts:sec.d.length*sec.p});
  }
  showRes(cor,tot,ss);
}

function showRes(cor,tot,ss){
  showPage("page-result");
  var ts=totalS(),earned=0;
  for(var i=0;i<ss.length;i++)earned+=ss[i].sc;
  var pct=Math.round(earned/ts*100);

  var h='<div class="sb2">';
  h+='<div class="sbg">'+earned+'<span> / '+ts+'</span></div>';
  h+='<div class="sbs">正确率 '+pct+'% · '+cor+'/'+tot+' 题正确</div>';
  h+='<div class="sbb"><div class="sbf" id="bf"></div></div>';
  h+='<div class="sbr">';
  for(var i=0;i<ss.length;i++){
    var c=ss[i].c===ss[i].t?"#4caf50":ss[i].c===0?"#f44336":"#d4a843";
    h+='<div class="sbi"><div class="sbil">'+ss[i].n+'</div><div class="sbiv" style="color:'+c+'">'+ss[i].c+'/'+ss[i].t+'</div></div>';
  }
  h+='</div></div>';

  h+='<div class="rbs"><button class="bh" onclick="goHome()">返回首页</button>';
  h+='<button class="br" onclick="startP('+pi+')">再做一次</button></div>';

  h+='<div class="rv"><h3>答题详情</h3>';
  var fi=0;
  for(var si=0;si<P[pi].s.length;si++){
    var sec=P[pi].s[si];
    for(var j=0;j<sec.d.length;j++){
      var idx=fi++,q=sec.d[j],ok=res[idx],ua=ans[idx];
      h+='<div class="ri'+(ok?"":" wr")+'">';
      h+='<div class="rh"><span>'+sec.n+' · 第'+(j+1)+'题</span><span>'+(ok?"V 正确":"X 错误")+'</span></div>';
      h+='<div class="rq">'+q.q+'</div>';

      if(sec.n==="判断题"){
        var lb2=["对","错"],vl2=[1,0];
        for(var vi=0;vi<2;vi++){
          var v=vl2[vi],iU=(ua===v),iC=(q.a===v);
          var bc=iC?"#4caf50":iU?"#f44336":"#333";
          var bg=iC?"rgba(76,175,80,0.1)":iU?"rgba(244,67,54,0.1)":"none";
          h+='<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid '+bc+';background:'+bg+';margin-bottom:3px;font-size:12px">';
          h+='<span style="width:16px;height:16px;border-radius:50%;border:2px solid '+bc+';background:'+(iU?bc:"none")+';color:'+(iU?"#fff":"transparent")+';display:flex;align-items:center;justify-content:center;font-size:9px">'+(iU?(iC?"V":"X"):"")+'</span>';
          h+=lb2[vi]+'</div>';
        }
      }else{
        for(var vi=0;vi<q.o.length;vi++){
          var lb=String.fromCharCode(65+vi);
          var iU=Array.isArray(ua)?(ua.indexOf(vi)>-1):(ua===vi);
          var iC=Array.isArray(q.a)?(q.a.indexOf(vi)>-1):(q.a===vi);
          var bc=iC?"#4caf50":iU?"#f44336":"#333";
          var bg=iC?"rgba(76,175,80,0.1)":iU?"rgba(244,67,54,0.1)":"none";
          h+='<div style="display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid '+bc+';background:'+bg+';margin-bottom:3px;font-size:12px">';
          h+='<span style="width:16px;height:16px;border-radius:50%;border:2px solid '+bc+';background:'+(iU?bc:"none")+';color:'+(iU?"#fff":"transparent")+';display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0">'+(iU?(iC?"V":"X"):"")+'</span>';
          h+='<span><b style="color:#777">'+lb+'.</b>'+q.o[vi]+'</span></div>';
        }
      }

      if(!ok){
        var ca=sec.n==="判断题"?(q.a===1?"对":"错"):fmtA(q.a);
        h+='<div class="ra" style="color:#f44336">正确答案：'+ca+'</div>';
      }
      h+='</div>';
    }
  }
  h+='</div>';
  $("page-result").innerHTML=h;
  setTimeout(function(){var b=$("bf");if(b)b.style.width=pct+"%";},50);
}

function goHome(){if(tid){clearInterval(tid);tid=null;}showPage("page-home");}
function exitQ(){if(confirm("确定退出吗？当前进度不会保存。"))goHome();}

renderList();
</script>
</body>
</html>
