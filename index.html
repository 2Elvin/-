<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制区通行证考试系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1426;--bg2:#111e35;--card:#162a48;--card2:#1c3356;
  --accent:#c9a84c;--accent2:#d9bc68;--accent-bg:rgba(201,168,76,.12);
  --txt:#e8e2d6;--txt2:#8a9bb5;--txt3:#556a82;
  --ok:#4caf50;--ok-bg:rgba(76,175,80,.12);
  --err:#ef5350;--err-bg:rgba(239,83,80,.12);
  --border:rgba(255,255,255,.08);--shadow:0 4px 24px rgba(0,0,0,.3);
  --radius:12px;--radius-sm:8px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;line-height:1.6}
.screen{display:none;min-height:100vh;animation:fadeUp .4s ease}
.screen.active{display:flex;flex-direction:column}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== HOME ===== */
#home{align-items:center;padding:40px 20px 60px;
  background:radial-gradient(ellipse at 20% 30%,rgba(201,168,76,.06) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 70%,rgba(22,42,72,.5) 0%,transparent 50%),var(--bg)}
.home-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:var(--accent-bg);border:1px solid rgba(201,168,76,.2);color:var(--accent);font-size:.8rem;font-weight:500;margin-bottom:24px;letter-spacing:.05em}
.home-badge svg{width:16px;height:16px;fill:var(--accent)}
.home-title{font-family:'Syne','Noto Sans SC',sans-serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:800;text-align:center;line-height:1.2;margin-bottom:8px;background:linear-gradient(135deg,var(--txt),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{color:var(--txt2);font-size:1rem;text-align:center;margin-bottom:40px;font-weight:300}
.mode-row{display:flex;gap:12px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
.mode-btn{padding:10px 24px;border-radius:24px;border:1px solid var(--border);background:transparent;color:var(--txt2);cursor:pointer;font-size:.9rem;font-family:inherit;transition:all .25s}
.mode-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.mode-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;width:100%;max-width:1000px}
.paper-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.paper-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity .3s}
.paper-card:hover{transform:translateY(-4px);border-color:rgba(201,168,76,.3);box-shadow:var(--shadow)}
.paper-card:hover::before{opacity:1}
.paper-num{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;color:var(--accent);opacity:.3;position:absolute;top:12px;right:20px}
.paper-name{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.paper-desc{color:var(--txt2);font-size:.85rem;margin-bottom:20px}
.paper-stats{display:flex;gap:16px;flex-wrap:wrap}
.paper-stat{font-size:.8rem;color:var(--txt3);display:flex;align-items:center;gap:4px}
.paper-stat span{color:var(--txt2);font-weight:500}
.paper-start{display:inline-flex;align-items:center;gap:6px;margin-top:20px;padding:8px 20px;border-radius:20px;background:var(--accent-bg);color:var(--accent);font-size:.85rem;font-weight:500;border:1px solid rgba(201,168,76,.2);transition:all .25s}
.paper-card:hover .paper-start{background:var(--accent);color:var(--bg)}

/* ===== QUIZ ===== */
#quiz{height:100vh;height:100dvh}
.quiz-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
.quiz-header-left{display:flex;align-items:center;gap:12px;min-width:0}
.btn-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s;flex-shrink:0}
.btn-icon:hover{border-color:var(--err);color:var(--err)}
.quiz-title-text{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-header-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.timer{display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--accent);padding:6px 14px;border-radius:20px;background:var(--accent-bg)}
.timer.warn{color:var(--err);animation:pulse 1s infinite}
.progress-text{font-size:.85rem;color:var(--txt2);font-weight:500}

.quiz-nav-wrap{padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.quiz-nav-wrap::-webkit-scrollbar{height:0}
.quiz-nav{display:flex;gap:4px;align-items:center;min-width:max-content}
.nav-label{font-size:.7rem;color:var(--txt3);font-weight:700;padding:0 6px;white-space:nowrap;letter-spacing:.05em}
.nav-dot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--txt3);cursor:pointer;font-size:.75rem;font-weight:600;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.nav-dot:hover{border-color:var(--accent);color:var(--accent)}
.nav-dot.answered{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.nav-dot.current{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.nav-dot.review-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.nav-dot.review-err{background:var(--err-bg);border-color:var(--err);color:var(--err)}

.quiz-body{flex:1;overflow-y:auto;padding:24px 20px 100px;-webkit-overflow-scrolling:touch}
.q-section-label{display:inline-block;font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:4px 12px;border-radius:12px;margin-bottom:12px;letter-spacing:.05em}
.q-score{font-size:.75rem;color:var(--txt3);margin-bottom:12px}
.q-text{font-size:1.05rem;font-weight:500;line-height:1.8;margin-bottom:20px}
.q-options{display:flex;flex-direction:column;gap:10px}
.q-option{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;transition:all .2s;user-select:none}
.q-option:hover{border-color:rgba(201,168,76,.3);background:var(--card)}
.q-option.selected{border-color:var(--accent);background:var(--accent-bg)}
.q-option.correct{border-color:var(--ok);background:var(--ok-bg)}
.q-option.wrong{border-color:var(--err);background:var(--err-bg)}
.q-option.disabled{pointer-events:none}
.q-option-indicator{width:22px;height:22px;border-radius:50%;border:2px solid var(--txt3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;font-size:.7rem}
.q-option.selected .q-option-indicator{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.q-option.correct .q-option-indicator{border-color:var(--ok);background:var(--ok);color:#fff}
.q-option.wrong .q-option-indicator{border-color:var(--err);background:var(--err);color:#fff}
.q-option-text{font-size:.95rem;line-height:1.5}
.q-option-label{font-weight:700;color:var(--txt2);margin-right:4px}
.q-tf{display:flex;gap:12px}
.q-tf .q-option{flex:1;justify-content:center;text-align:center;font-weight:600}

.quiz-footer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:12px 20px;background:var(--bg2);border-top:1px solid var(--border);z-index:10}
.btn{padding:10px 24px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:.9rem;font-weight:600;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--card);color:var(--txt2);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--bg);flex:1}
.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-submit{background:var(--ok);color:#fff;padding:10px 32px}
.btn-submit:hover:not(:disabled){filter:brightness(1.1)}
.btn-home{background:var(--accent);color:var(--bg);padding:12px 32px;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;border:none;cursor:pointer;font-family:inherit}

/* ===== RESULT ===== */
#result{align-items:center;padding:40px 20px 60px;
  background:radial-gradient(ellipse at 50% 20%,rgba(201,168,76,.06) 0%,transparent 50%),var(--bg)}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;max-width:700px;width:100%;text-align:center;margin-bottom:24px}
.result-score{font-family:'Syne',sans-serif;font-size:4rem;font-weight:800;color:var(--accent);line-height:1}
.result-score span{font-size:1.5rem;color:var(--txt3);font-weight:600}
.result-pct{font-size:1.2rem;color:var(--txt2);margin:8px 0 24px}
.result-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-bottom:24px}
.result-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width 1s ease}
.result-details{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center}
.result-detail-item{padding:12px;border-radius:var(--radius-sm);background:var(--bg)}
.result-detail-label{font-size:.75rem;color:var(--txt3);margin-bottom:4px}
.result-detail-value{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700}
.result-detail-value.ok{color:var(--ok)}
.result-detail-value.err{color:var(--err)}
.result-detail-value.accent{color:var(--accent)}

.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.review-section{max-width:700px;width:100%}
.review-section h3{font-size:1.1rem;font-weight:700;margin:24px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);color:var(--accent)}
.review-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;margin-bottom:12px}
.review-q.review-ok{border-left:3px solid var(--ok)}
.review-q.review-err{border-left:3px solid var(--err)}
.review-q-num{font-size:.8rem;color:var(--txt3);margin-bottom:8px;display:flex;justify-content:space-between}
.review-q-text{font-size:.95rem;margin-bottom:12px;line-height:1.7}
.review-q .q-option{margin-bottom:6px;font-size:.85rem;padding:10px 12px}
.review-q .q-option.correct{border-color:var(--ok);background:var(--ok-bg)}
.review-q .q-option.wrong{border-color:var(--err);background:var(--err-bg)}
.review-q .q-option.selected{border-color:var(--accent);background:var(--accent-bg)}
.review-q .q-option.selected.wrong-answer{border-color:var(--err);background:var(--err-bg)}
.review-q .q-tf{gap:8px}
.review-q .q-tf .q-option{font-size:.85rem;padding:8px}
.review-answer{font-size:.85rem;color:var(--ok);font-weight:600;margin-top:8px}

@media(max-width:640px){
  .paper-grid{grid-template-columns:1fr}
  .quiz-body{padding:16px 16px 100px}
  .result-card{padding:28px 20px}
  .result-score{font-size:3rem}
  .result-details{grid-template-columns:1fr}
  .quiz-header{padding:10px 12px}
  .quiz-nav-wrap{padding:8px 12px}
  .quiz-footer{padding:10px 12px}
  .btn{padding:10px 16px;font-size:.85rem}
}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <div class="screen active" id="home">
    <div class="home-badge">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      福州长乐国际机场
    </div>
    <h1 class="home-title">控制区通行证<br>管理规定考试</h1>
    <p class="home-sub">福建省公安厅机场公安局 · 2019年6月1日起执行</p>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="exam" onclick="setMode('exam')">考试模式</button>
      <button class="mode-btn" data-mode="practice" onclick="setMode('practice')">练习模式</button>
    </div>
    <div class="paper-grid" id="paperGrid"></div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="quiz">
    <div class="quiz-header">
      <div class="quiz-header-left">
        <button class="btn-icon" onclick="exitQuiz()" title="退出">✕</button>
        <span class="quiz-title-text" id="qTitle"></span>
      </div>
      <div class="quiz-header-right">
        <span class="progress-text" id="qProgress"></span>
        <div class="timer" id="timerBox"><span id="timerText">60:00</span></div>
      </div>
    </div>
    <div class="quiz-nav-wrap"><div class="quiz-nav" id="qNav"></div></div>
    <div class="quiz-body" id="qBody"></div>
    <div class="quiz-footer">
      <button class="btn btn-secondary" id="btnPrev" onclick="prevQ()">上一题</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQ()">下一题</button>
      <button class="btn btn-submit" id="btnSubmit" onclick="submitQuiz()">交卷</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result">
    <div class="result-card" id="resultCard"></div>
    <div class="result-actions" style="margin-bottom:32px">
      <button class="btn-home" onclick="goHome()">返回首页</button>
      <button class="btn-home" style="background:var(--card);color:var(--txt);border:1px solid var(--border)" onclick="retryPaper()">再做一次</button>
    </div>
    <div class="review-section" id="reviewSection"></div>
  </div>
</div>

<script>
// ========== EXAM DATA ==========
const papers = [
{
  title:"试卷一",
  sections:[
  {name:"判断题",score:2,questions:[
    {q:"机场控制区通行证是人员、车辆进出机场控制区的有效凭证。",a:true},
    {q:"任何单位的制式服装、标志、标识、证件、证明均可作为通行福州机场控制区的凭证。",a:false},
    {q:"福州机场控制区实行封闭式分区管理。",a:true},
    {q:"本规定所称"以上"包括本数，"以内"不包括本数。",a:false},
    {q:"申办通行证的人员应当通过背景调查，方可办理通行证。",a:true},
    {q:"人员临时通行证在工作时间内随到随办，特殊情况可提前办理。",a:true},
    {q:"持临时通行证的人员可以自行进入机场控制区，无需引领人员引领。",a:false},
    {q:"控制区通行证属于免检证明，人员或车辆进入机场控制区时无需接受安全检查。",a:false},
    {q:"伪造、变造、涂改通行证的行为，可依照《中华人民共和国治安管理处罚法》等进行处罚。",a:true},
    {q:"本规定自2019年6月1日起执行。",a:true}
  ]},
  {name:"单选题",score:3,questions:[
    {q:"福州机场通行证的主管部门是（ ）。",o:["福州机场集团公司","福建省公安厅机场公安局","福州市公安局","民航华东地区管理局"],a:1},
    {q:"人员长期通行证的有效期为（ ）。",o:["1个月以上1年以内","6个月以上2年以内","9个月以上3年以内","1年以上5年以内"],a:2},
    {q:"人员短期通行证的有效期为（ ）。",o:["1天至7天","7天以上9个月以内","7天以上6个月以内","1个月以上6个月以内"],a:1},
    {q:"其他通行证（非临时）的办理期限为收件日起（ ）个工作日内办结。",o:["3","5","7","10"],a:2},
    {q:"申办通行证的人员应接受不少于（ ）学时的通行证使用和管理培训。",o:["1","4","8","20"],a:0},
    {q:"考核不合格的人员补考（ ）次仍不合格的，需经不少于20个学时的培训后再进行考核。",o:["1","2","3","5"],a:1},
    {q:"持证人员调离、退休、辞职或被开除，申办单位应将其通行证回收并在（ ）日内交通行证主管部门注销。",o:["3","5","7","10"],a:1},
    {q:"通行证有效期满需要变更的，应在期满前（ ）个工作日内向通行证主管部门提出变更申请。",o:["5","10","15","20"],a:1},
    {q:"A3区是指（ ）。",o:["停机坪、围场路、服务车道","国内、国际进出港行李分拣、装卸区","滑行道、跑道","国内候机隔离区"],a:2},
    {q:"申办单位可以最多提名（ ）名通行证审核签署人。",o:["1","2","3","5"],a:2}
  ]},
  {name:"多选题",score:5,questions:[
    {q:"以下属于人员长期通行证发放范围的有（ ）。",o:["需进入控制区从事民航生产运输等工作，与用人单位签定2年以上或无固定期用工合同的工作人员","担负机场安全保卫任务的国家公务人员","口岸联检单位的工作人员","各单位新招录的试用期人员"],a:[0,1,2]},
    {q:"持证人员在机场控制区内活动时，以下哪些行为是严禁的？（ ）",o:["使用伪造、变造、涂改的通行证","转借、冒用通行证","未经同意进入停机坪、跑道、滑行道等航空器活动区","在机场控制区非吸烟区吸烟"],a:[0,1,2,3]},
    {q:"以下哪些情形需要办理人员临时通行证？（ ）",o:["负责警卫和国家规定的要客接待人员","进入控制区进行临时性施工、作业的人员","已办理长、短期通行证，因工作需进入本人通行证未申请区域的人员","各单位长期驻场的正式员工"],a:[0,1,2]},
    {q:"通行证申办单位必须履行的职责包括（ ）。",o:["认真审核通行证申办材料","负责本单位通行证的申领、发放、续办、变更、挂失、注销等工作","对本单位员工进行空防安全及通行证使用管理的教育培训","制定本单位有关控制区通行证的管理制度"],a:[0,1,2,3]},
    {q:"B区（国内候机隔离区）可通行的区域包括（ ）。",o:["国内出港旅客安检区至国内航班登机桥固定端之间的区域","D1区","D2区","E区"],a:[0,1]}
  ]}
]},
{
  title:"试卷二",
  sections:[
  {name:"判断题",score:2,questions:[
    {q:"引领是指引导、带领不具有单独进入控制区资格的人员进入控制区的一种资格。",a:true},
    {q:"持短期通行证的人员即具有引领资格。",a:false},
    {q:"每次进入控制区，引领部门要确定至少1名引领人。",a:true},
    {q:"持车辆长期通行证进入控制区，查验人员应检查驾驶员内场驾驶证。",a:true},

// ========== STATE ==========
let S={paper:null,pi:0,qi:0,ans:{},practice:false,timer:null,time:3600,submitted:false,results:null};
const $=id=>document.getElementById(id);
const totalQ=p=>p.sections.reduce((s,sec)=>s+sec.questions.length,0);
const totalScore=p=>p.sections.reduce((s,sec)=>s+sec.questions.length*sec.score,0);
const flatIndex=(pi,qi)=>{let n=0;for(let i=0;i<pi;i++)n+=S.paper.sections[i].questions.length;return n+qi;};
const getQ=fi=>{let n=0;for(const sec of S.paper.sections){if(fi<n+sec.questions.length){const lq=fi-n;return{sec,q:sec.questions[lq],qi:lq};}n+=sec.questions.length;}};

// ========== MODE ==========
function setMode(m){S.practice=m==='practice';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));}

// ========== HOME ==========
function renderHome(){
  const g=$('paperGrid');g.innerHTML='';
  papers.forEach((p,i)=>{
    const tq=totalQ(p),ts=totalScore(p);
    const secs=p.sections.map(s=>`${s.name}${s.questions.length}题`).join(' / ');
    g.innerHTML+=`<div class="paper-card" onclick="startPaper(${i})">
      <div class="paper-num">${String(i+1).padStart(2,'0')}</div>
      <div class="paper-name">${p.title}</div>
      <div class="paper-desc">${secs}</div>
      <div class="paper-stats">
        <div class="paper-stat">共 <span>${tq}</span> 题</div>
        <div class="paper-stat">满分 <span>${ts}</span> 分</div>
        <div class="paper-stat">时长 <span>60</span> 分钟</div>
      </div>
      <div class="paper-start">开始答题 →</div>
    </div>`;
  });
}

// ========== START ==========
function startPaper(i){
  S.paper=papers[i];S.pi=i;S.qi=0;S.ans={};S.submitted=false;S.results=null;S.time=3600;
  showScreen('quiz');
  $('qTitle').textContent=S.paper.title+(S.practice?' · 练习模式':' · 考试模式');
  renderNav();renderQ();
  if(!S.practice)startTimer();else $('timerBox').style.display='none';
  if(S.practice)$('btnSubmit').style.display='none';else $('btnSubmit').style.display='';
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);}

// ========== TIMER ==========
function startTimer(){clearInterval(S.timer);S.timer=setInterval(()=>{S.time--;if(S.time<=0){clearInterval(S.timer);alert('时间到，自动交卷！');submitQuiz();}updateTimer();},1000);updateTimer();}
function updateTimer(){const m=Math.floor(S.time/60),s=S.time%60;$('timerText').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('timerBox').classList.toggle('warn',S.time<300);}

// ========== NAV ==========
function renderNav(){
  const nav=$('qNav');nav.innerHTML='';let fi=0;
  S.paper.sections.forEach((sec,si)=>{
    nav.innerHTML+=`<span class="nav-label">${sec.name}</span>`;
    sec.questions.forEach((_,qi)=>{
      const idx=fi++;
      const answered=S.ans[idx]!==undefined;
      const isCurrent=idx===flatIndex(S.pi,S.qi);
      nav.innerHTML+=`<button class="nav-dot${answered?' answered':''}${isCurrent?' current':''}" onclick="goToQ(${idx})">${qi+1}</button>`;
    });
  });
  updateProgress();
}
function updateNav(){
  const dots=document.querySelectorAll('.nav-dot');
  let fi=0;
  S.paper.sections.forEach((sec,si)=>{
    sec.questions.forEach((_,qi)=>{
      const idx=fi++;
      const dot=dots[idx];if(!dot)return;
      dot.className='nav-dot';
      if(S.submitted&&S.results){
        const ok=S.results[idx];
        if(ok)dot.classList.add('review-ok');else dot.classList.add('review-err');
      }else{
        if(S.ans[idx]!==undefined)dot.classList.add('answered');
      }
      if(idx===flatIndex(S.pi,S.qi))dot.classList.add('current');
    });
  });
  updateProgress();
}
function updateProgress(){
  const total=totalQ(S.paper);
  const answered=Object.keys(S.ans).length;
  $('qProgress').textContent=`${answered}/${total}`;
}
function goToQ(fi){let n=0;for(let si=0;si<S.paper.sections.length;si++){const len=S.paper.sections[si].questions.length;if(fi<n+len){S.qi=fi-n;break;}n+=len;}renderQ();renderNav();}

// ========== RENDER QUESTION ==========
function renderQ(){
  const fi=flatIndex(S.pi,S.qi);
  const{sec,q,qi}=getQ(fi);
  const body=$('qBody');
  const secIdx=S.paper.sections.indexOf(sec);
  let html=`<div class="q-section-label">${sec.name}</div>`;
  html+=`<div class="q-score">第${qi+1}题 · ${sec.score}分</div>`;
  html+=`<div class="q-text">${q.q}</div>`;

  if(sec.name==='判断题'){
    html+=`<div class="q-tf">`;
    ['对','错'].forEach((label,vi)=>{
      const val=vi===0;
      const sel=S.ans[fi]===val;
      const cls=S.practice&&S.submitted?(val===q.a?'correct':''):'';
      const dis=S.practice&&S.submitted?'disabled':'';
      html+=`<div class="q-option${sel?' selected':''} ${cls} ${dis}" onclick="ansTF(${fi},${val})">
        <span class="q-option-indicator">${sel?'✓':''}</span>
        <span class="q-option-text">${label}</span>
      </div>`;
    });
    html+=`</div>`;
  }else{
    html+=`<div class="q-options">`;
    q.o.forEach((opt,vi)=>{
      const label=String.fromCharCode(65+vi);
      const isArr=Array.isArray(S.ans[fi]);
      const sel=isArr?S.ans[fi].includes(vi):S.ans[fi]===vi;
      let cls='';
      if(S.practice&&S.submitted){
        const isCorrect=Array.isArray(q.a)?q.a.includes(vi):q.a===vi;
        if(isCorrect)cls='correct';
        if(sel&&!isCorrect)cls='wrong';
      }
      const dis=S.practice&&S.submitted?'disabled':'';
      html+=`<div class="q-option${sel?' selected':''} ${cls} ${dis}" onclick="ansChoice(${fi},${vi},${sec.name==='多选题'?1:0})">
        <span class="q-option-indicator">${sel?(S.practice&&S.submitted?(cls==='correct'?'✓':'✗'):'✓'):''}</span>
        <span class="q-option-text"><span class="q-option-label">${label}.</span>${opt}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  if(S.practice&&S.submitted){
    const isOk=S.results&&S.results[fi];
    html+=`<div class="review-answer" style="color:${isOk?'var(--ok)':'var(--err)'}">${isOk?'✓ 回答正确':'✗ 回答错误 — 正确答案：'+(sec.name==='判断题'?(q.a?'对':'错'):formatAnswer(q.a))}</div>`;
  }

  body.innerHTML=html;
  body.scrollTop=0;
  $('btnPrev').disabled=S.qi===0;
  const lastQ=S.paper.sections[S.paper.sections.length-1].questions.length-1;
  const lastSec=S.paper.sections.length-1;
  const isLast=S.pi===lastSec&&S.qi===lastQ;
  $('btnNext').textContent=isLast?'':'下一题';
  $('btnNext').disabled=isLast;
  updateNav();
}
function formatAnswer(a){
  if(Array.isArray(a))return a.map(i=>String.fromCharCode(65+i)).join('');
  return String.fromCharCode(65+a);
}

// ========== ANSWER ==========
function ansTF(fi,val){if(S.practice&&S.submitted)return;S.ans[fi]=val;if(S.practice){checkPractice(fi);return;}renderQ();}
function ansChoice(fi,vi,multi){if(S.practice&&S.submitted)return;
  if(multi){
    let arr=Array.isArray(S.ans[fi])?([...S.ans[fi]]):[];
    const idx=arr.indexOf(vi);
    if(idx>-1)arr.splice(idx,1);else arr.push(vi);
    arr.sort();S.ans[fi]=arr.length?arr:undefined;
  }else{S.ans[fi]=vi;}
  if(S.practice){checkPractice(fi);return;}
  renderQ();
}
function checkPractice(fi){
  const{sec,q}=getQ(fi);
  S.submitted=true;S.results=S.results||{};
  let ok=false;
  if(sec.name==='判断题'){ok=S.ans[fi]===q.a;}
  else if(Array.isArray(q.a)){ok=Array.isArray(S.ans[fi])&&q.a.length===(S.ans[fi]||[]).length&&q.a.every(a=>(S.ans[fi]||[]).includes(a));}
  else{ok=S.ans[fi]===q.a;}
  S.results[fi]=ok;
  renderQ();
}

// ========== NAVIGATION ==========
function prevQ(){if(S.qi>0){S.qi--;renderQ();renderNav();}}
function nextQ(){
  const sec=S.paper.sections;
  let totalPrev=0;
  for(let i=0;i<=S.pi;i++)totalPrev+=sec[i].questions.length;
  const fi=flatIndex(S.pi,S.qi);
  if(fi<totalQ(S.paper)-1){goToQ(fi+1);}
}

// ========== SUBMIT ==========
function submitQuiz(){
  if(!S.practice&&!S.submitted){
    const unanswered=totalQ(S.paper)-Object.keys(S.ans).length;
    if(unanswered>0&&!confirm(`还有${unanswered}题未作答，确定交卷吗？`))return;
    clearInterval(S.timer);
  }
  S.submitted=true;
  // Calculate results
  S.results={};let correct=0,total=0,secStats=[];
  S.paper.sections.forEach(sec=>{
    let sc=0,st=sec.questions.length;
    let fi=0;for(let i=0;i<S.paper.sections.indexOf(sec);i++)fi+=S.paper.sections[i].questions.length;
    sec.questions.forEach((q,qi)=>{
      const idx=fi+qi;total++;
      let ok=false;
      if(sec.name==='判断题'){ok=S.ans[idx]===q.a;}
      else if(Array.isArray(q.a)){ok=Array.isArray(S.ans[idx])&&q.a.length===(S.ans[idx]||[]).length&&q.a.every(a=>(S.ans[idx]||[]).includes(a));}
      else{ok=S.ans[idx]===q.a;}
      S.results[idx]=ok;if(ok){sc++;correct++;}
    });
    secStats.push({name:sec.name,correct:sc,total:st,score:sc*sec.score,totalScore:st*sec.score});
  });
  renderResult(correct,total,secStats);
}
function renderResult(correct,total,secStats){
  showScreen('result');
  const ts=totalScore(S.paper);
  const earned=secStats.reduce((s,x)=>s+x.score,0);
  const pct=Math.round(earned/ts*100);
  $('resultCard').innerHTML=`
    <div class="result-score">${earned}<span> / ${ts}</span></div>
    <div class="result-pct">正确率 ${pct}% · ${correct}/${total} 题正确</div>
    <div class="result-bar"><div class="result-bar-fill" style="width:0%"></div></div>
    <div class="result-details">
      ${secStats.map(s=>`<div class="result-detail-item">
        <div class="result-detail-label">${s.name}</div>
        <div class="result-detail-value ${s.correct===s.total?'ok':s.correct===0?'err':'accent'}">${s.correct}/${s.total}</div>
      </div>`).join('')}
    </div>`;
  setTimeout(()=>{$('.result-bar-fill').style.width=pct+'%';},100);
  renderReview();
}
function renderReview(){
  const sec=$('reviewSection');sec.innerHTML='<h3>答题详情</h3>';
  let fi=0;
  S.paper.sections.forEach((section,si)=>{
    section.questions.forEach((q,qi)=>{
      const idx=fi++;
      const ok=S.results[idx];
      const userAns=S.ans[idx];
      let html=`<div class="review-q ${ok?'review-ok':'review-err'}">
        <div class="review-q-num"><span>${section.name} · 第${qi+1}题</span><span>${ok?'✓ 正确':'✗ 错误'}</span></div>
        <div class="review-q-text">${q.q}</div>`;
      if(section.name==='判断题'){
        ['对','错'].forEach((label,vi)=>{
          const val=vi===0;
          const isUser=userAns===val;
          const isCorrect=q.a===val;
          let cls='q-option ';
          if(isCorrect)cls+='correct';
          if(isUser&&!isCorrect)cls+='wrong';
          if(isUser)cls+='selected';
          html+=`<div class="${cls}"><span class="q-option-indicator">${isUser?(isCorrect?'✓':'✗'):''}</span><span class="q-option-text">${label}</span></div>`;
        });
      }else{
        q.o.forEach((opt,vi)=>{
          const label=String.fromCharCode(65+vi);
          const isUser=Array.isArray(userAns)?userAns.includes(vi):userAns===vi;
          const isCorrect=Array.isArray(q.a)?q.a.includes(vi):q.a===vi;
          let cls='q-option ';
          if(isCorrect)cls+='correct';
          if(isUser&&!isCorrect)cls+='wrong';
          if(isUser)cls+='selected';
          html+=`<div class="${cls}"><span class="q-option-indicator">${isUser?(isCorrect?'✓':'✗'):''}</span><span class="q-option-text"><span class="q-option-label">${label}.</span>${opt}</span></div>`;
        });
      }
      if(!ok){
        html+=`<div class="review-answer">正确答案：${section.name==='判断题'?(q.a?'对':'错'):formatAnswer(q.a)}</div>`;
      }
      html+=`</div>`;
      sec.innerHTML+=html;
    });
  });
}

// ========== UTILS ==========
function exitQuiz(){if(!confirm('确定退出吗？当前进度将不会保存。'))return;clearInterval(S.timer);goHome();}
function goHome(){clearInterval(S.timer);showScreen('home');}
function retryPaper(){startPaper(S.pi);}

// ========== INIT ==========
renderHome();
</script>
